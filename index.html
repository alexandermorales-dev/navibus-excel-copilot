<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Excel AI Copilot</title>
  <!-- Office.js API from CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <link rel="stylesheet" href="css/style.css?v=43" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <span class="header-icon">AI</span>
        <span>Excel Copilot</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Quota bar: pooled free-tier requests remaining today -->
    <div id="quotaBar" class="quota-bar hidden"></div>

    <!-- Settings Panel (hidden by default) -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-section">
        <h3 class="settings-title" data-i18n="providersTitle">Proveedores de IA</h3>
        <p class="settings-hint" data-i18n="providersHint"></p>
        <!-- One row per provider, rendered by app.js from the Providers registry -->
        <div id="providerList" class="provider-list"></div>
      </div>

      <details class="settings-section">
        <summary class="settings-title" data-i18n="advancedTitle">Avanzado</summary>
        <div id="advancedList" class="advanced-list"></div>
        <div class="settings-row">
          <button id="resetQuotaBtn" class="btn-secondary" data-i18n="resetQuota">Reiniciar contadores de cuota</button>
        </div>
      </details>

      <div class="settings-row">
        <button id="clearChatBtn" class="btn-secondary" data-i18n="clearChat">Borrar conversación</button>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="messageList" class="message-list">
      <div class="message assistant">
        <div class="message-avatar">AI</div>
        <div class="message-content">
          <p data-i18n="welcomeTitle">¡Hola! Soy tu Excel AI Copilot. Puedo ayudarte a crear informes, paneles de control, tablas, gráficos y más — y responder preguntas sobre tus datos.</p>
          <p data-i18n="welcomeHint">Listo para usar. Para mejor rendimiento, ingresa tu propia API key en Configuración.</p>
        </div>
      </div>
    </div>

    <!-- Status bar (for rate-limit countdown, etc.) -->
    <div id="statusBar" class="status-bar hidden"></div>

    <!-- Input area -->
    <div class="input-area">
      <textarea id="messageInput" data-i18n-ph="placeholder" placeholder="Pregúntame sobre tus datos o pídeme crear algo... (ej: crea un panel de control)" rows="2"></textarea>
      <button id="stopBtn" class="btn-stop" title="Stop" aria-label="Stop" disabled data-i18n="stop">Detener</button>
      <button id="sendBtn" class="btn-send" title="Send" aria-label="Send" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scripts (cache-busted: change ?v= when updating).
       Load order matters: config/i18n first, then the provider+transport
       layer, then Office.js-backed modules, then the orchestrator. -->
  <script src="js/config.js?v=43"></script>
  <script src="js/i18n.js?v=43"></script>
  <script src="js/providers.js?v=43"></script>
  <script src="js/quota.js?v=43"></script>
  <script src="js/llm.js?v=43"></script>
  <script src="js/schema.js?v=43"></script>
  <script src="js/journal.js?v=43"></script>
  <script src="js/tools.js?v=43"></script>
  <script src="js/recipes.js?v=43"></script>
  <script src="js/ops.js?v=43"></script>
  <script src="js/context.js?v=43"></script>
  <script src="js/prompt.js?v=43"></script>
  <script src="js/intent.js?v=43"></script>
  <script src="js/agent.js?v=43"></script>
  <script src="js/app.js?v=43"></script>
</body>
</html>
